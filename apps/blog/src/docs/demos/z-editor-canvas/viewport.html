<z-column gap="3" style="width: 100%">
  <z-editor-canvas id="canvas" grid="dots" style="width: 100%; height: 16rem">
    <z-canvas-item x="120" y="80"><z-card>Drag the surface</z-card></z-canvas-item>
  </z-editor-canvas>
  <z-row gap="3" aligns-y="center">
    <z-button id="zoom" size="small" kind="outline">Zoom to 150%</z-button>
    <z-text id="log" size="xs" color="muted" style="font-family: var(--font-mono)">x 0 · y 0 · zoom 1</z-text>
  </z-row>
</z-column>
