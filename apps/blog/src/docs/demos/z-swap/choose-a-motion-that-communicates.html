<z-row gap="4">
  <z-swap label="Fade">
    <span slot="off">Off</span>
    <span slot="on">On</span>
  </z-swap>
  <z-swap label="Rotate" effect="rotate">
    <span slot="off">−</span>
    <span slot="on">+</span>
  </z-swap>
  <z-swap label="Flip" effect="flip">
    <span slot="off">A</span>
    <span slot="on">B</span>
  </z-swap>
</z-row>
