    <z-avatar name="Ada Lovelace" size="xs" status="online"></z-avatar>
    Ada Lovelace
    <z-badge size="small" kind="outline">Design</z-badge>
  </z-command-item>
  <z-command-item value="grace" label="Grace Hopper" keywords="engineering">
