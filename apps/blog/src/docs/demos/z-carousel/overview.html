<z-carousel loop autoplay="5000">
  <z-card
    is-flex
    is-column
    gap="2"
    style="height: 12rem; justify-content: center; align-items: center; border: 0px; background: color-mix(in oklch, var(--purple) 14%, transparent)"
  >
    <z-heading size="xs" tag="h3">Ship inward</z-heading>
    <z-text size="sm" color="muted">Slide one</z-text>
  </z-card>
  <z-card
    is-flex
    is-column
    gap="2"
    style="height: 12rem; justify-content: center; align-items: center; border: 0px; background: color-mix(in oklch, var(--pink) 14%, transparent)"
  >
    <z-heading size="xs" tag="h3">Name it well</z-heading>
    <z-text size="sm" color="muted">Slide two</z-text>
  </z-card>
</z-carousel>
