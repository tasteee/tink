<z-dialog
  heading="Edit profile"
  description="Update how your profile appears."
  size="medium"
>
  <z-button slot="trigger">Edit profile</z-button>
  <z-column gap="3">
    <z-input label="Display name" value="Ada Lovelace"></z-input>
  </z-column>
  <z-row slot="footer" gap="2" aligns-x="end">
    <z-button kind="plain">Cancel</z-button>
    <z-button>Save changes</z-button>
  </z-row>
</z-dialog>
