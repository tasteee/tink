name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installs @tasteee/zest from GitHub and builds it.
      - run: pnpm install --frozen-lockfile

      - name: Diagnose zest install
        run: |
          readlink -f apps/vink/node_modules/@tasteee/zest
          ls apps/vink/node_modules/@tasteee/zest/dist | head -20
          grep -n toaster apps/vink/node_modules/@tasteee/zest/dist/index.d.ts || echo 'NO toaster in index.d.ts'
          ls -la apps/vink/node_modules/@tasteee/zest/dist/components/z-toaster.d.ts || echo 'NO z-toaster.d.ts'
          cat apps/vink/node_modules/@tasteee/zest/package.json | head -12

      # Typechecks and builds the home page, tools and every app.
      - run: pnpm build
